name: "04 - Infrastructure Tear Down"

on:
  workflow_dispatch:
    inputs:
      working_dir:
        description: "Terraform directory to destroy"
        required: true
        type: choice
        options:
          - terraform/cluster
          - terraform/persistent
        default: terraform/cluster

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "eu-west-2"
  AWS_ROLE_ARN: "arn:aws:iam::206868134740:role/github-actions-tf-destroy-role"
  TF_VAR_aiops_notify_email: ${{ vars.AIOPS_NOTIFY_EMAIL }}

jobs:
  infrastructure-destroy:
    name: "Destroy ${{ inputs.working_dir }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - name: "Configure AWS via OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "Destroy"
        run: |
          terraform init
          terraform destroy -auto-approve -input=false
        working-directory: ${{ inputs.working_dir }}
