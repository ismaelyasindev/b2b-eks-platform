name: "05 - Deploy Storefront Frontend"

on:
  push:
    branches: ["main"]
    paths:
      - "eks-frontend/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "eu-west-2"
  AWS_ROLE_ARN: "arn:aws:iam::206868134740:role/github-actions-frontend-deploy-role"
  STOREFRONT_BUCKET: "b2b-platform-storefront-london"
  CLOUDFRONT_DIST_ID: ""

jobs:
  deploy-frontend:
    name: "Sync to S3"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configure AWS via OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Sync static assets"
        run: aws s3 sync eks-frontend/ "s3://${STOREFRONT_BUCKET}/" --delete

      - name: "Invalidate CloudFront"
        if: ${{ env.CLOUDFRONT_DIST_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DIST_ID}" \
            --paths "/*"
