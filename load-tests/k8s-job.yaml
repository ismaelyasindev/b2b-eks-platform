apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile
  namespace: prod
data:
  locustfile.py: |
    from locust import HttpUser, between, task


    class NewUserStorm(HttpUser):
        wait_time = between(0.1, 0.5)

        @task
        def signup_storm(self):
            self.client.post(
                "/auth/signup",
                json={"email": "test@test.com"},
                headers={"X-Trigger-Storm": "true"},
            )
---
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-signup-storm
  namespace: prod
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: locustio/locust:2.32.8
          args:
            - -f
            - /mnt/locust/locustfile.py
            - --headless
            - -u
            - "60"
            - -r
            - "10"
            - --run-time
            - 10m
            - --host
            - http://auth-svc.prod.svc.cluster.local
          volumeMounts:
            - name: locustfile
              mountPath: /mnt/locust
              readOnly: true
      volumes:
        - name: locustfile
          configMap:
            name: locustfile
