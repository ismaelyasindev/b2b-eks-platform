worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Re-resolve Docker service names when containers restart (prevents 404s
  # caused by stale upstream IPs cached at nginx startup).
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream auth_svc {
    zone auth_svc 64k;
    server auth:8000 resolve;
  }
  upstream product_svc {
    zone product_svc 64k;
    server product:8000 resolve;
  }
  upstream order_svc {
    zone order_svc 64k;
    server order:8000 resolve;
  }
  upstream payment_svc {
    zone payment_svc 64k;
    server payment:8000 resolve;
  }
  upstream notification_svc {
    zone notification_svc 64k;
    server notification:8000 resolve;
  }

  server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/         { proxy_pass http://auth_svc/auth/; }
    location /api/product/      { proxy_pass http://product_svc/product/; }
    location /api/order         { proxy_pass http://order_svc/order; }
    location /api/payment/      { proxy_pass http://payment_svc/payment/; }
    location /api/notification/ { proxy_pass http://notification_svc/notification/; }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
