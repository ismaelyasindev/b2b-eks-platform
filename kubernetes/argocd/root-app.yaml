apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: b2b-platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ismaelyasindev/b2b-eks-platform.git'
    targetRevision: main
    path: kubernetes/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
